[workspace]
resolver = "2"
members = ["crates/schema", "crates/snap", "crates/read", "crates/link", "crates/judge", "crates/cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
py-spy = "0.4"
waitson-schema = { path = "crates/schema" }
waitson-snap = { path = "crates/snap" }
waitson-read = { path = "crates/read" }
waitson-link = { path = "crates/link" }
waitson-judge = { path = "crates/judge" }

[profile.release]
strip = true
