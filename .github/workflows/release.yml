name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: cargo build --release
      - name: package
        run: |
          tar -czf "waitson-${{ matrix.target }}.tar.gz" -C target/release waitson
      - name: publish to the release
        uses: softprops/action-gh-release@v2
        with:
          files: waitson-${{ matrix.target }}.tar.gz
