name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unit tests and clippy
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings
          cargo test --release
      - name: hangbook
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc python3 procps golang default-jdk-headless
          cargo build --release
          # The workflow runner can ptrace its own children without hardening.
          python3 hangbook/harness.py

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: build and unit tests
        run: |
          cargo build --release
          cargo test --release
