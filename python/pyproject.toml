[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "waitson"
version = "0.1.0"
description = "Point it at any process. It tells you what the process is waiting for."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }

[project.urls]
Homepage = "https://github.com/hardy30894/waitson"

[project.scripts]
waitson = "waitson.__main__:main"

[tool.setuptools]
packages = ["waitson"]
